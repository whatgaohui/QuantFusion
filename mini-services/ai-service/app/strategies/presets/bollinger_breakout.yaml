name: Bollinger Breakout
id: bollinger_breakout
type: breakout
description: 布林带突破策略 - 价格突破布林带上轨买入，跌破下轨卖出
parameters:
  period: 20
  std_dev: 2.0
  squeeze_threshold: 0.02
entry_condition: price breaks above upper_band AND bandwidth > squeeze_threshold
exit_condition: price breaks below lower_band OR price returns to middle_band
risk_management:
  stop_loss_pct: 0.04
  take_profit_pct: 0.12
